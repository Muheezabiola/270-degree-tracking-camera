; ============================================================
;  270° Tracking Camera — firmware for both MCUs
;
;  One repository, one code base, two boards. The compile-time
;  flag NODE_FLAG_SERVO / NODE_FLAG_CAMERA selects which MCU the
;  upload targets (see include/config.h):
;
;    servo_node   ESP32 DevKit
;                 PIR pair -> pan servo -> capture request -> SMS
;    camera_node  AI-Thinker ESP32-CAM
;                 capture request -> JPEG -> SD archive -> Telegram
;
;  Selecting a node:
;    VS Code  - choose the environment in the PlatformIO toolbar,
;               then press Upload.
;    CLI      - pio run -e servo_node  -t upload
;               pio run -e camera_node -t upload
;
;  Why two boards?  The ESP32-CAM spends almost every GPIO on the
;  camera bus, the micro-SD slot and the status LED, so the
;  servo/PIR/SIM800L wiring has nowhere to live. See README.md.
;
;  Credentials live in include/secrets.h, which is git-ignored.
;  Copy include/secrets.example.h to include/secrets.h and fill it
;  in — the build stops with a clear #error if it is missing.
; ============================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; --- Stop the serial monitor from resetting the board on open ---
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

; ------------------------------------------------------------
;  SERVO / CAPTURE NODE — standard ESP32 DevKit (ESP32-WROOM-32)
; ------------------------------------------------------------
[env:servo_node]
board = esp32dev
build_flags = -D NODE_FLAG_SERVO
build_src_filter =
    +<*>
    -<camera_node.cpp>
    -<camera_driver.cpp>
    -<image_storage.cpp>
    -<telegram_client.cpp>
    -<trigger_input.cpp>
    -<wifi_link.cpp>
lib_deps =
    ; Servo pulse generation on the ESP32 LEDC timers
    madhephaestus/ESP32Servo @ ^3.2.1

; ------------------------------------------------------------
;  CAMERA NODE — AI-Thinker ESP32-CAM (OV2640 + micro-SD slot)
;
;  `board = esp32cam` already enables PSRAM, the PSRAM cache fix
;  and the huge_app partition table the camera + TLS stack need,
;  so no extra board flags are required here.
; ------------------------------------------------------------
[env:camera_node]
board = esp32cam
build_flags = -D NODE_FLAG_CAMERA
build_src_filter =
    +<*>
    -<servo_node.cpp>
    -<servo_driver.cpp>
    -<pir_sensor.cpp>
    -<capture_trigger.cpp>
    -<sms_notifier.cpp>
; Lower to 115200 if your USB-serial adapter struggles with the
; ESP32-CAM's boot-time baud rate.
upload_speed = 460800
lib_deps =
    ; OV2640 driver (no longer bundled with the Arduino core)
    espressif/esp32-camera @ ^2.0.4
